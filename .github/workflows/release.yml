name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build installer, archive, and checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${VERSION#v} ./scripts/release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" Artifacts/* --generate-notes
